<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mobile Emulation Numen by Rosmi</title>
  <style>
    :root { --bg: #09090b; --card: #111118; --accent: #22c55e; --blue: #3b82f6; --red: #ef4444; --line: #27272a; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 380px; border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; background: #0c0c0e; }
    .content { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    h2 { font-size: 12px; text-transform: uppercase; color: #71717a; letter-spacing: 0.05em; margin-bottom: 15px; }

    input { width: 100%; background: #000; color: #fff; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
    input:focus { border-color: var(--blue); }

    .btn-main { background: var(--blue); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
    .btn-main:hover { opacity: 0.9; }

    .profile-card { background: #16161e; border: 1px solid var(--line); padding: 15px; border-radius: 12px; margin-bottom: 12px; }
    .profile-card strong { display: block; margin-bottom: 10px; font-size: 15px; }

    .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .social-grid button { background: #1f1f29; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .social-grid button:hover { border-color: var(--accent); background: #262633; }

    .btn-del { width: 100%; margin-top: 10px; background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,0.2); padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .btn-del:hover { background: rgba(239,68,68,0.05); border-color: var(--red); }

    .session-item { border-left: 4px solid var(--accent); background: #16161e; padding: 15px; margin-bottom: 12px; border-radius: 0 10px 10px 0; }
    .header-log { font-family: 'Consolas', monospace; font-size: 10px; color: #86efac; background: #000; padding: 10px; border-radius: 6px; margin-top: 8px; word-break: break-all; border: 1px solid #1f1f24; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Gestión de Perfiles</h2>
    <input id="pName" placeholder="Nombre del cliente o cuenta...">
    <button class="btn-main" onclick="createNewProfile()">Crear Perfil Persistente</button>
    
    <h2>Listado</h2>
    <div id="pList">
      </div>
  </div>

  <div class="content">
    <h2>Monitor de Ventanas Activas (Stealth Mode)</h2>
    <div id="sList">
      <p style="color: #52525b; font-size: 14px;">No hay ventanas abiertas.</p>
    </div>
  </div>

  <script>
    // 1. Crear Perfil
    async function createNewProfile() {
      const input = document.getElementById('pName');
      const name = input.value.trim();
      if(!name) return;

      await window.mobileDebug.saveProfile({ 
        id: Date.now().toString(), 
        name: name 
      });

      input.value = '';
      loadProfiles();
    }

    // 2. Cargar Perfiles en Sidebar
    async function loadProfiles() {
      const profiles = await window.mobileDebug.getProfiles();
      const cont = document.getElementById('pList');
      
      if (!profiles || profiles.length === 0) {
        cont.innerHTML = '<p style="color:gray; font-size:12px;">Crea tu primer perfil para empezar.</p>';
        return;
      }

      cont.innerHTML = profiles.map(p => `
        <div class="profile-card">
          <strong>👤 ${p.name}</strong>
          <div class="social-grid">
            <button onclick="launch('${p.id}', '${p.name}', 'https://m.facebook.com')">FACEBOOK</button>
            <button onclick="launch('${p.id}', '${p.name}', 'https://x.com')">TWITTER</button>
            <button onclick="launch('${p.id}', '${p.name}', 'https://www.instagram.com')">INSTAGRAM</button>
            <button onclick="launch('${p.id}', '${p.name}', 'https://www.tiktok.com')">TIKTOK</button>
          </div>
          <button class="btn-del" onclick="deleteProfile('${p.id}')">ELIMINAR PERFIL</button>
        </div>
      `).join('');
    }

    // 3. Lanzar Ventana
    function launch(id, name, url) {
      window.mobileDebug.openBrowser({ 
        profileId: id, 
        profileName: name, 
        url: url 
      });
    }

    // 4. Eliminar Perfil
    async function deleteProfile(id) {
      if(confirm('¿Eliminar perfil y limpiar todas sus cookies?')) {
        await window.mobileDebug.deleteProfile(id);
        loadProfiles();
      }
    }

    // 5. Monitor de Ventanas (Derecha)
    window.mobileDebug.onSessionsUpdated((sessions) => {
      const cont = document.getElementById('sList');
      if(!sessions || sessions.length === 0) {
        cont.innerHTML = '<p style="color:#52525b;">No hay ventanas abiertas.</p>';
        return;
      }

      cont.innerHTML = sessions.map(([winId, data]) => `
        <div class="session-item">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; color:var(--blue)">PERFIL: ${data.profileName}</span>
            <span style="font-size:10px; background:#064e3b; color:#10b981; padding:2px 6px; border-radius:4px;">ID: ${winId}</span>
          </div>
          <div class="header-log">
            <strong>Injected User-Agent:</strong><br>${data.userAgent}<br><br>
            <strong>Hardware:</strong> Pixel 8 | CPU: ARM | Touch: Enabled
          </div>
        </div>
      `).join('');
    });

    // Carga inicial
    window.onload = loadProfiles;
  </script>
</body>
</html>
