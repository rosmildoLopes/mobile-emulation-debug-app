<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --bg: #09090b; --card: #111118; --accent: #22c55e; --blue: #3b82f6; --line: #27272a; --red: #ef4444; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 400px; border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; background: #0c0c0e; }
    .content { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg); }
    .card-p { background: #16161e; border: 1px solid var(--line); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    input { width: 100%; background: #000; color: #fff; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-bottom: 8px; box-sizing: border-box; font-size: 13px; }
    button { cursor: pointer; border-radius: 8px; font-weight: bold; border: 1px solid #334155; background: #18181b; color: #fff; padding: 8px; font-size: 12px; }
    button:hover { border-color: var(--accent); }
    .btn-main { background: var(--blue); color: white; border: none; width: 100%; padding: 12px; margin-bottom: 25px; font-size: 14px; }
    .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
    .search-group { display: flex; gap: 5px; margin-top: 10px; }
    .session-item { border-left: 4px solid var(--accent); background: #16161e; padding: 15px; margin-bottom: 10px; border-radius: 0 8px 8px 0; }
    .status-tag { font-size: 10px; color: #86efac; font-family: monospace; display: block; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2 style="font-size:18px; margin-top:0">Configuración QA</h2>
    <input id="pName" placeholder="Nombre del Perfil">
    <input id="pProxy" placeholder="Proxy (ip:port o user:pass@ip:port)">
    <button class="btn-main" onclick="save()">Crear Perfil Persistente</button>
    
    <div id="pList"></div>
  </div>

  <div class="content">
    <h2 style="font-size:18px; margin-top:0">Monitor de Sesiones Activas</h2>
    <div id="sList">
      <p style="color:gray">No hay ventanas abiertas.</p>
    </div>
  </div>

  <script>
    async function save() {
      const name = document.getElementById('pName').value;
      const proxy = document.getElementById('pProxy').value;
      if(!name) return;
      await window.mobileDebug.saveProfile({ id: Date.now().toString(), name, proxy });
      document.getElementById('pName').value = '';
      document.getElementById('pProxy').value = '';
      load();
    }

    async function load() {
      const profiles = await window.mobileDebug.getProfiles();
      const cont = document.getElementById('pList');
      cont.innerHTML = profiles.length ? '' : '<p style="color:gray; font-size:12px;">Crea un perfil para comenzar.</p>';
      
      profiles.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card-p';
        div.innerHTML = `
          <strong style="font-size:16px;">👤 ${p.name}</strong>
          <div style="font-size:10px; color:var(--blue); margin: 5px 0;">🌐 Proxy: ${p.proxy || 'Conexión Directa'}</div>
          
          <div class="search-group">
            <input id="url_${p.id}" placeholder="URL o Búsqueda..." value="https://google.com" style="margin:0">
            <button onclick="launch('${p.id}', '${p.name}', '${p.proxy}', document.getElementById('url_${p.id}').value)">IR</button>
          </div>

          <div class="social-grid">
            <button onclick="launch('${p.id}', '${p.name}', '${p.proxy}', 'https://m.facebook.com')">FB</button>
            <button onclick="launch('${p.id}', '${p.name}', '${p.proxy}', 'https://x.com')">X</button>
            <button onclick="launch('${p.id}', '${p.name}', '${p.proxy}', 'https://instagram.com')">IG</button>
            <button onclick="launch('${p.id}', '${p.name}', '${p.proxy}', 'https://tiktok.com')">TK</button>
          </div>
          
          <button style="width:100%; margin-top:10px; color:var(--red); border-color:rgba(239,68,68,0.2)" onclick="del('${p.id}')">Eliminar Perfil</button>
        `;
        cont.appendChild(div);
      });
    }

    function launch(id, name, proxy, url) {
      window.mobileDebug.openBrowser({ profileId: id, profileName: name, proxy, url });
    }

    async function del(id) {
      if(confirm('¿Borrar perfil y todas sus sesiones?')) {
        await window.mobileDebug.deleteProfile(id);
        load();
      }
    }

    window.mobileDebug.onSessionsUpdated((sessions) => {
      const cont = document.getElementById('sList');
      if(!sessions || sessions.length === 0) {
        cont.innerHTML = '<p style="color:gray">No hay ventanas abiertas.</p>';
        return;
      }
      cont.innerHTML = sessions.map(([id, data]) => `
        <div class="session-item">
          <strong>Perfil: ${data.profileName}</strong> | Proxy: ${data.proxy}
          <span class="status-tag">Stealth: Pixel 8 Hardware Mask Active | WebGL Masked</span>
        </div>
      `).join('');
    });

    window.onload = load;
  </script>
</body>
</html>
